<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="370" viewBox="0 0 1300 370" role="img" aria-label="OnePass key hierarchy"><title>OnePass key hierarchy</title><defs><marker id="a-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56566E"/></marker><marker id="a-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#56566E"/></marker></defs><text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#8B949E" text-anchor="start" letter-spacing="1.5">KEY HIERARCHY</text><text x="40" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8B949E" text-anchor="start">Two secrets in, one random key per item out. Every step is a separate key.</text><rect x="40" y="104" width="210" height="76" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="145.0" y="138.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#E6EDF3" text-anchor="middle">Master password</text><text x="145.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8B949E" text-anchor="middle">you remember it</text><rect x="40" y="252" width="210" height="76" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="145.0" y="286.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#E6EDF3" text-anchor="middle">Secret Key</text><text x="145.0" y="308.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8B949E" text-anchor="middle">256-bit, made on device</text><path d="M254,142 C292,142 284,196 310,196" fill="none" stroke="#56566E" stroke-width="1.75" marker-end="url(#a-end)"/><path d="M254,290 C292,290 284,232 310,232" fill="none" stroke="#56566E" stroke-width="1.75" marker-end="url(#a-end)"/><rect x="316" y="166" width="184" height="96" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="408.0" y="200.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#E6EDF3" text-anchor="middle">Argon2id + HKDF</text><text x="408.0" y="222.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8B949E" text-anchor="middle">256 MiB, t = 4, p = 4</text><text x="408.0" y="240.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8B949E" text-anchor="middle">enforced floors</text><line x1="504" y1="214" x2="538" y2="214" stroke="#56566E" stroke-width="1.75" marker-end="url(#a-end)"/><text x="522.0" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#B7B6FF" text-anchor="middle">derives</text><rect x="544" y="176" width="150" height="76" rx="14" fill="#1F1D3D" stroke="#8A88FF" stroke-width="2"/><text x="619.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#B7B6FF" text-anchor="middle">Unlock Key</text><text x="619.0" y="232.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8B949E" text-anchor="middle">AUK</text><line x1="698" y1="214" x2="732" y2="214" stroke="#56566E" stroke-width="1.75" marker-end="url(#a-end)"/><text x="716.0" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#B7B6FF" text-anchor="middle">seals</text><rect x="738" y="176" width="150" height="76" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="813.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#E6EDF3" text-anchor="middle">Keyset</text><text x="813.0" y="232.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8B949E" text-anchor="middle">KEM + signing</text><line x1="892" y1="214" x2="926" y2="214" stroke="#56566E" stroke-width="1.75" marker-end="url(#a-end)"/><text x="910.0" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#B7B6FF" text-anchor="middle">hybrid KEM</text><rect x="932" y="176" width="150" height="76" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="1007.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#E6EDF3" text-anchor="middle">Vault key</text><text x="1007.0" y="232.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8B949E" text-anchor="middle">one per vault</text><line x1="1086" y1="214" x2="1120" y2="214" stroke="#56566E" stroke-width="1.75" marker-end="url(#a-end)"/><text x="1104.0" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#B7B6FF" text-anchor="middle">AEAD</text><rect x="1126" y="176" width="150" height="76" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><text x="1201.0" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#E6EDF3" text-anchor="middle">Item key</text><text x="1201.0" y="232.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8B949E" text-anchor="middle">per item, per write</text><text x="316" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8B949E" text-anchor="start">Keyset: hybrid KEM key (ML-KEM-1024 + X25519) and hybrid signing key (ML-DSA-87 + Ed25519).</text><text x="316" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8B949E" text-anchor="start">Items: AES-256-GCM-SIV with HMAC-SHA256 key commitment and size-tier padding.</text></svg>
