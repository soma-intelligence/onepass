<!doctype html>
<html lang="en"><head><title>Create your account</title></head>
<body>
<h1>Create your account</h1>
<form id="join" action="/join" method="post">
  <label for="new-email">Email</label>
  <input id="new-email" name="email" type="email" autocomplete="email">
  <label for="new-pw">Password</label>
  <input id="new-pw" name="password" type="password" autocomplete="new-password">
  <label for="new-pw2">Confirm password</label>
  <input id="new-pw2" name="password_confirmation" type="password" autocomplete="new-password">
  <button type="submit">Create account</button>
</form>
</body></html>
