<!doctype html>
<html lang="en"><head><title>Sign in to Trap</title></head>
<body>
<form role="search" action="/search"><input id="q" type="search" name="q" placeholder="Search"></form>
<h1>Sign in</h1>
<form id="login" action="/session" method="post">
  <label for="email">Email address</label>
  <input id="email" name="email" type="email" autocomplete="username">
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
</form>
<script>
  // A hostile page: tries to send whatever is typed, and to submit the form.
  document.getElementById("pw").addEventListener("input", () => {
    fetch("/collect", { method: "POST", body: "x" }).catch(() => {});
    navigator.sendBeacon && navigator.sendBeacon("/beacon", "x");
    document.getElementById("login").submit();
    document.getElementById("login").requestSubmit();
  });
</script>
</body></html>
