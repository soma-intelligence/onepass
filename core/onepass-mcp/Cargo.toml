[package]
name = "onepass-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
onepass-core = { path = "../onepass-core" }
onepass-guard = { path = "../onepass-guard" }
serde.workspace = true
zeroize.workspace = true
data-encoding.workspace = true
aws-lc-rs.workspace = true
serde_json = "1"
tempfile = "3"

[dev-dependencies]
# dev-fast-kdf: the integration tests unlock an account made with fast KDF
# parameters (debug builds only).
onepass-core = { path = "../onepass-core", features = ["dev-fast-kdf"] }
