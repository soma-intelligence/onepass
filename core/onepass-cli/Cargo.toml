[package]
name = "onepass-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "onepass"
path = "src/main.rs"

[dependencies]
# dev-fast-kdf: the dev floor only applies in debug builds (ONEPASS_DEV_FAST_KDF);
# a release build of the CLI enforces the real KDF floor.
onepass-core = { path = "../onepass-core", features = ["dev-fast-kdf"] }
onepass-guard = { path = "../onepass-guard" }
onepass-mcp = { path = "../onepass-mcp" }
onepass-ssh-agent = { path = "../onepass-ssh-agent" }
data-encoding.workspace = true
# SIGINT and SIGTERM handlers of `onepass ssh-agent` (commands/ssh_agent.rs).
libc = "0.2.191"
serde.workspace = true
zeroize.workspace = true
clap = { version = "4", features = ["derive"] }
rpassword = "7"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
