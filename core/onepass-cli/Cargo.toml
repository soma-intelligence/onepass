[package]
name = "onepass-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "onepass"
path = "src/main.rs"

[dependencies]
onepass-core = { path = "../onepass-core" }
onepass-guard = { path = "../onepass-guard" }
onepass-mcp = { path = "../onepass-mcp" }
onepass-ssh-agent = { path = "../onepass-ssh-agent" }
onepass-peer = { path = "../onepass-peer" }
data-encoding.workspace = true
# SIGINT and SIGTERM handlers of `onepass ssh-agent` (commands/ssh_agent.rs).
libc = "0.2.191"
serde.workspace = true
zeroize.workspace = true
clap = { version = "4", features = ["derive"] }
rpassword = "7"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["std"] }

# The Secret Key lives in the secret store of the system (secret_store.rs):
# the login keychain on macOS (same crate and version as onepass-peer)...
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }

# ...and the Secret Service over the session D-Bus on Linux (links
# libdbus-1: building needs libdbus-1-dev and pkg-config). No crypto
# feature: plain session over the user's own bus.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1.0", default-features = false }

[features]
# Lets ONEPASS_DEV_FAST_KDF=1 create accounts at the dev Argon2id floor, in
# debug builds only (see onepass-core). Off by default: a plain
# `cargo build -p onepass-cli` never links the dev floor. For manual tests:
# `cargo run -p onepass-cli --features dev-fast-kdf`.
dev-fast-kdf = ["onepass-core/dev-fast-kdf"]

[dev-dependencies]
# dev-fast-kdf: the unit tests and the binary `cargo test` builds for the
# end-to-end tests make accounts at the dev floor (debug builds only).
onepass-core = { path = "../onepass-core", features = ["dev-fast-kdf"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
