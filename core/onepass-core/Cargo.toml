[package]
name = "onepass-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
uuid.workspace = true
aws-lc-rs.workspace = true
zeroize.workspace = true
data-encoding.workspace = true
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
unicode-normalization = "0.1.26"
slh-dsa = "=0.1.0"
# Not used directly: slh-dsa 0.1.0 only builds against this prerelease
# (later 2.3.0-pre releases moved to rand_core 0.9). Remove with slh-dsa 0.2.
signature = "=2.3.0-pre.4"
serde_bytes = "0.11.17"
postcard = { version = "1", default-features = false, features = ["alloc"] }
time = { version = "0.3", default-features = false, features = ["serde", "std"] }

[dev-dependencies]
time = { version = "0.3", features = ["macros"] }
proptest = "1.12"
serde_json = "1"
libcrux-ml-kem = "0.0.11"
libcrux-ml-dsa = "0.0.11"
