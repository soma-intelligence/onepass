[[audits.ariel-os.audits.async-io]]
who = "Antoine Lavandier <antoine.lavandier@inria.fr>"
criteria = "safe-to-deploy"
delta = "2.2.2 -> 2.3.0"
notes = """
New unsafe code uses includes:
- `Registration::new_waitable` in `Waitable::new`. The constraint is upheld by the implementation although not stated.
- `Send + Sync` impls on `Registration`. No idea if that's safe.
- `Poller::add_waitable` in `Registration::add`. Covered by the previous safety comment for `Poller::add`
"""

