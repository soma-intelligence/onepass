notes = """
New unsafe code uses includes:
- `polling::Process::from_pid` in `kqueue::Registration::add`. This code is only reached by registration of the form `Registration::Process(_)` which are only produced by `os::kqueue::Exit` which upholds the expected constraint either by construction when used from safe code or by forwarded the constraint when used from unsafe code.
Otherwise this just groups apple OSes by their common vendor in `cfg`s.
"""

