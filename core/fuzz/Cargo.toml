[package]
name = "onepass-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_bytes = "0.11"
onepass-core = { path = "../onepass-core", features = ["dev-fast-kdf"] }
onepass-mailbox-proto = { path = "../onepass-mailbox-proto" }
onepass-mcp = { path = "../onepass-mcp" }
onepass-ssh-agent = { path = "../onepass-ssh-agent" }
serde_json = "1"

[workspace]

[[bin]]
name = "blob_open"
path = "fuzz_targets/blob_open.rs"
test = false
doc = false
bench = false

