[package]
name = "onepass-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_bytes = "0.11"
onepass-core = { path = "../onepass-core" }

[workspace]

[[bin]]
name = "blob_open"
path = "fuzz_targets/blob_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_manifest"
path = "fuzz_targets/signed_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "account_params"
path = "fuzz_targets/account_params.rs"
test = false
doc = false
bench = false

[[bin]]
name = "item_record"
path = "fuzz_targets/item_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signature_verify"
path = "fuzz_targets/signature_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "otpauth_parse"
path = "fuzz_targets/otpauth_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reference_parse"
path = "fuzz_targets/reference_parse.rs"
test = false
doc = false
bench = false
