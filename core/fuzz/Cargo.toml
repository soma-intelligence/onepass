[package]
name = "onepass-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
onepass-core = { path = "../onepass-core" }

[workspace]

[[bin]]
name = "blob_open"
path = "fuzz_targets/blob_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_decode"
path = "fuzz_targets/manifest_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "otpauth_parse"
path = "fuzz_targets/otpauth_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reference_parse"
path = "fuzz_targets/reference_parse.rs"
test = false
doc = false
bench = false
