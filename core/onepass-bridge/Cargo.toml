[package]
name = "onepass-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
aws-lc-rs.workspace = true
data-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
psl.workspace = true
url.workspace = true
# General category and bidi control data for passkey user names. Already
# in the lock through `url` (idna): no new crate.
icu_properties = "2"
# Accent folding of document holder names. Already in the lock through
# onepass-core: no new crate.
unicode-normalization = "0.1.26"
onepass-core = { path = "../onepass-core" }
time = { version = "0.3", default-features = false, features = ["std"] }
# Seeded ML-KEM for the test-vector helpers only. The production path uses
# aws-lc-rs alone; this crate is compiled in only with feature `vectors`.
libcrux-ml-kem = { version = "0.0.11", optional = true }

[features]
# Deterministic KEM helpers for cross-language test vectors. Never enable in
# a shipped build.
vectors = ["dep:libcrux-ml-kem"]

# Cross-language vectors need the deterministic helpers of feature `vectors`.
[[test]]
name = "vectors"
required-features = ["vectors"]

[dev-dependencies]
libcrux-ml-kem = "0.0.11"
