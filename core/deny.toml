[advisories]
version = 2
yanked = "deny"
# Kept in step with core/.cargo/audit.toml (cargo audit): same advisories,
# same reasons, same review dates.
ignore = [
    # proc-macro-error2 is unmaintained. Reached only through the libcrux
    # dev-dependencies (hax-lib-macros), compile time, not shipped code; not a
    # vulnerability. Review by 2027-01-31.
    { id = "RUSTSEC-2026-0173", reason = "unmaintained proc macro, libcrux dev-dependencies only; review by 2027-01-31" },
    # basic-toml is unmaintained. Reached only through askama_derive, a proc
    # macro of the uniffi bindings generator (onepass-ffi, feature bindgen),
    # compile time, not shipped code; not a vulnerability. cargo deny does not
    # see it (feature off in its graph), cargo audit reads the whole lockfile.
    # Review by 2027-01-31.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained, uniffi bindgen proc macro only; review by 2027-01-31" },
    # zvariant, zvariant_derive and zbus_names are unmaintained. Reached through
    # zbus, the D-Bus client onepass-wifi uses to talk to NetworkManager on
    # Linux (onepass-cli wifi). Shipped code, but no known vulnerability.
    # Replace or update zbus by 2027-01-31.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained, zbus D-Bus client of onepass-wifi on Linux; review by 2027-01-31" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained, zbus D-Bus client of onepass-wifi on Linux; review by 2027-01-31" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained, zbus D-Bus client of onepass-wifi on Linux; review by 2027-01-31" },
]

[licenses]
# The allowlist is minimal: an entry no dependency uses fails the check.
# AGPL-3.0-or-later covers the workspace crates themselves.
unused-allowed-license = "deny"
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
# The Mozilla root certificates the mailbox client trusts (spec 4.4) are data
# under CDLA-Permissive-2.0, a permissive data licence. Allowed for that one
# crate only.
exceptions = [
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
