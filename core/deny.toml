[advisories]
version = 2
# RUSTSEC-2026-0173: proc-macro-error2 is unmaintained. It is reached only
# through the libcrux dev-dependencies (hax-lib-macros), not a vulnerability.
# RUSTSEC-2026-0374: basic-toml is unmaintained; it is reached only by the
# optional bindgen tool, via uniffi_bindgen and askama_derive (build time).
ignore = [
    "RUSTSEC-2026-0173",
    { id = "RUSTSEC-2026-0374", reason = "basic-toml: build-time only, via uniffi_bindgen/askama_derive" },
]

[licenses]
# Allowlist is wider than current deps on purpose (future crypto crates).
unused-allowed-license = "allow"
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
