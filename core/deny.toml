[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0173: proc-macro-error2 is unmaintained. It is reached only
# through the libcrux dev-dependencies (hax-lib-macros), not a vulnerability.
ignore = [
    "RUSTSEC-2026-0173",
]

[licenses]
# The allowlist is minimal: an entry no dependency uses fails the check.
# AGPL-3.0-or-later covers the workspace crates themselves.
unused-allowed-license = "deny"
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
