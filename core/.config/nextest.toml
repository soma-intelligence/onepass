# cargo-nextest settings (https://nexte.st). `make quick` and `make nextest`
# run through these; `cargo test` still works and ignores this file.

[profile.default]
# Report a test as slow after 60 s and kill it after 5 periods (5 min), so a
# hung test fails loudly instead of holding a build slot for an hour.
slow-timeout = { period = "60s", terminate-after = 5 }
# A test that leaves a subprocess behind fails after 1 s instead of hanging.
leak-timeout = "1s"
fail-fast = false
# Debug builds already optimize the crypto crates (see Cargo.toml), so most
# tests take well under a second; 4 threads keep the Mac usable while
# several builds run. Override with NEXTEST_TEST_THREADS.
test-threads = 4
status-level = "slow"
final-status-level = "fail"

# The SLH-DSA identity key and full rotation suites are legitimately slow in
# debug builds: give them twice the budget before they are killed. test()
# matches test names only, so the integration suites are named by binary()
# too (the share_vaults convergence tests need about 245 s alone and timed
# out at 300 s under load while this filter missed them).
[[profile.default.overrides]]
filter = "test(/slh_dsa|identity_key|rotation_v2|share_vaults/) | binary(/slh_dsa|rotation_v2|share_vaults/)"
slow-timeout = { period = "120s", terminate-after = 5 }

# Two exhaustive sharing tests need 6 to 7 minutes alone in a debug build
# (413 s and 345 s measured): 15 minutes before they are killed.
[[profile.default.overrides]]
filter = "test(/race_8_3_all_orders|oversized_full_grant_lists_nothing/)"
slow-timeout = { period = "180s", terminate-after = 5 }

[profile.ci]
test-threads = "num-cpus"
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# scripts/verify.sh and `make test`. Inherits the default profile, its
# per-test timeouts and overrides included; runs every test (no fail-fast),
# lists slow ones as they pass 60 s, and sums up failures and retries at the
# end.
[profile.verify]
fail-fast = false
status-level = "slow"
final-status-level = "flaky"

# Retries are for known races of the test harness only, never for the code
# under test; a test that passes on its retry is still reported as FLAKY.
# onepass-peer's identity tests write a copy of a test binary and exec it
# while other test threads fork: a child forked in that window inherits the
# copy's write descriptor and exec fails with "Text file busy" (ETXTBSY).
[[profile.verify.overrides]]
filter = "binary_id(onepass-peer::identity)"
retries = 1

# onepass-mcp-relay's relay tests connect real local sockets to a child
# process and give it a few seconds to come up, which a loaded Mac misses.
[[profile.verify.overrides]]
filter = "binary_id(onepass-mcp-relay::relay)"
retries = 1
