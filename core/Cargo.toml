[workspace]
resolver = "3"
members = ["onepass-core", "onepass-mailbox-proto", "onepass-mailbox", "onepass-pairnet", "onepass-sync", "onepass-cli", "onepass-ffi", "onepass-guard", "onepass-mcp", "onepass-mcp-relay", "onepass-peer", "onepass-ssh-agent", "onepass-bridge", "onepass-native-host", "onepass-relay", "onepass-bench", "onepass-wifi", "onepass-cdp"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }
aws-lc-rs = "1.18"
zeroize = { version = "1.9", features = ["derive", "serde"] }
data-encoding = "2.11"
serde_json = "1"
psl = "2"
url = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# SLH-DSA-SHA2-256s hashes through sha2: unoptimized, one signature takes
# about 35 s in debug tests instead of about 15 s.
[profile.dev.package.sha2]
opt-level = 3

# SLH-DSA itself (both slh-dsa versions): its hypertree loops dominate the
# identity key tests in debug builds.
[profile.dev.package.slh-dsa]
opt-level = 3

# Task 19 carried item 8: the rest of the crypto (ML-KEM, ML-DSA, X25519,
# Ed25519 and SHA in aws-lc, Argon2id and BLAKE2b at the dev KDF floor,
# the libcrux differential crates, SHA-3) and the bundled SQLite dominate
# the debug test suite unoptimized. Optimized in dev and test builds only;
# the workspace's own crates keep their debug build.
[profile.dev.package.aws-lc-sys]
opt-level = 3

[profile.dev.package.aws-lc-rs]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.libcrux-ml-kem]
opt-level = 3

[profile.dev.package.libcrux-ml-dsa]
opt-level = 3

[profile.dev.package.libcrux-sha3]
opt-level = 3

[profile.dev.package.libcrux-intrinsics]
opt-level = 3

[profile.dev.package.sha3]
opt-level = 3

[profile.dev.package.keccak]
opt-level = 3

[profile.dev.package.hybrid-array]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3
