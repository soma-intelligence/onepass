[workspace]
resolver = "3"
members = ["onepass-core", "onepass-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
