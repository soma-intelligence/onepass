[package]
name = "onepass-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "onepass_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
onepass-core = { path = "../onepass-core" }
# Milestone 7 in the apps: the SSH agent and the MCP server served by the
# app, with the hardened guards (approvals, grants, registry, audit log).
onepass-guard = { path = "../onepass-guard" }
onepass-mcp = { path = "../onepass-mcp" }
# The relay's wire messages (the relay itself is a separate binary).
onepass-mcp-relay = { path = "../onepass-mcp-relay" }
onepass-peer = { path = "../onepass-peer" }
onepass-ssh-agent = { path = "../onepass-ssh-agent" }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_json.workspace = true
data-encoding.workspace = true
uniffi = { version = "=0.32.2" }
zeroize.workspace = true
time = { version = "0.3", default-features = false, features = ["std"] }
# Domain matching of AutoFill: the Public Suffix List and URL parsing.
psl = "2"
url = "2"
# The production bridge (spec 2026-10-27-release-bridge-design): the host loop
# of the extension protocol, and its JSON audit journal.
onepass-bridge = { path = "../onepass-bridge" }
# Cross-platform sync (spec 4.14): the mailbox client, its wire messages and
# the Rust sync round.
onepass-mailbox = { path = "../onepass-mailbox" }
onepass-mailbox-proto = { path = "../onepass-mailbox-proto" }
onepass-sync = { path = "../onepass-sync" }
# The test mailbox server of the Swift tests (`dev-fast-kdf` only).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"], optional = true }
aws-lc-rs = { workspace = true, optional = true }

# The bridge's socket and the code-signature checks of its clients: Mac only.
[target.'cfg(target_os = "macos")'.dependencies]
onepass-relay = { path = "../onepass-relay" }

[features]
# The Swift binding generator (`cargo run --features bindgen --bin uniffi-bindgen`).
bindgen = ["uniffi/cli"]
# Lowers the Argon2id floor in debug builds only (see onepass-core): for the
# tests and the Swift test framework, never for a shipped build.
dev-fast-kdf = [
    "onepass-core/dev-fast-kdf",
    "onepass-mailbox/testing",
    "dep:rustls",
    "dep:aws-lc-rs",
]

[dev-dependencies]
tempfile = "3"
# Builds 1PUX exports (zip) for the re-import tests.
zip = { version = "9.1.1", default-features = false, features = ["deflate"] }
# Verifies passkey assertion signatures in the AutoFill tests.
aws-lc-rs.workspace = true
# The integration tests make fast-KDF accounts: they need the dev floor of the
# core (debug builds only) whichever way the tests are invoked.
onepass-core = { path = "../onepass-core", features = ["dev-fast-kdf"] }
# The mailbox tests serve FakeMailbox over loopback TLS (test CA).
onepass-mailbox = { path = "../onepass-mailbox", features = ["testing"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
