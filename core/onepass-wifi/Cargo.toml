[package]
name = "onepass-wifi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Wi-Fi profiles of Windows (netsh) and Linux (NetworkManager) for the onepass CLI"

# No onepass-core dependency on purpose: this crate has no C code to build,
# so `cargo check -p onepass-wifi --target x86_64-pc-windows-gnu` (or any
# Linux target) works from any machine without a cross C toolchain.
[dependencies]
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

# NetworkManager over the system D-Bus (pure Rust, no libdbus).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"
