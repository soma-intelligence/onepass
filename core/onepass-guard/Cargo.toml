[package]
name = "onepass-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
aws-lc-rs.workspace = true
data-encoding.workspace = true
libc = "0.2.191"
serde_json = "1"
tempfile = "3"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }


# Touch ID (LocalAuthentication) for strong approvals, macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError", "LAPublicDefines"] }
