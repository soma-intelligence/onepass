[package]
name = "onepass-peer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# SHA-256 of executable files (identity of unsigned clients).
aws-lc-rs.workspace = true
data-encoding.workspace = true
# Kernel credentials of socket peers (getpeereid, LOCAL_PEERPID,
# LOCAL_PEERTOKEN, SO_PEERCRED), parent pids and executable paths.
libc = "0.2.191"

# Code-signing identity of running processes (Security.framework).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
security-framework-sys = { version = "2.17", default-features = false }
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3"
