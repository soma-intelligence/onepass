[package]
name = "onepass-peer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# SHA-256 of executable files (identity of unsigned clients).
aws-lc-rs.workspace = true
data-encoding.workspace = true
# Kernel credentials of socket peers (getpeereid, LOCAL_PEERPID,
# LOCAL_PEERTOKEN, SO_PEERCRED), parent pids and executable paths.
libc = "0.2.191"

# Code-signing identity of running processes (Security.framework).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
security-framework-sys = { version = "2.17", default-features = false }
core-foundation = "0.10"
core-foundation-sys = "0.8"

# Parent pids, liveness and image paths of processes on Windows (spec
# 2026-10-30 section 9: the Windows branch of onepass-peer).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
