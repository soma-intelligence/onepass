[project]
name = "onepass-ml"
version = "0.1.0"
description = "OnePass autofill dataset tooling: ingestion, training, export"
requires-python = ">=3.12,<3.13"
dependencies = ["pyarrow==21.0.0"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onepass_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
