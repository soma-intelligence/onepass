[project]
name = "onepass-ml"
version = "0.1.0"
description = "OnePass autofill dataset tooling: ingestion, training, export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm==4.7.0",
    "numpy==2.5.4",
    "onnx==1.23.2",
    "onnxmltools==1.16.0",
    "onnxruntime==1.31.1",
    "pyarrow==21.0.0",
    "scipy==1.18.1",
    "sentencepiece==0.2.2",
    "tokenizers==0.23.3",
    "torch==2.14.1",
    "transformers==5.19.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onepass_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: real-size model checks, run with -m slow"]
