name: android

on:
  push:
    paths:
      - "core/**"
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "core/**"
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

# A newer push supersedes the run of the same branch.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Rust core and the FFI on Android (plan X4, Task 1): both ABIs built
  # with the pinned NDK and checked for 16 KiB pages, then every test of
  # onepass-core, onepass-ffi and onepass-peer run inside an API 29 x86_64
  # emulator. The emulator needs KVM: GitHub's standard Linux runners give
  # it to public repositories; on a private repository the emulator would
  # run unaccelerated and time out (use a larger runner there).
  core:
    name: core (Android API 29 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Hardware acceleration for the x86_64 emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pinned versions
        run: |
          . android/scripts/versions.env
          {
            echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION"
            echo "CARGO_NDK_VERSION=$CARGO_NDK_VERSION"
            echo "ANDROID_MIN_API=$ANDROID_MIN_API"
          } >> "$GITHUB_ENV"
      # rustup reads core/rust-toolchain.toml (toolchain and Android targets).
      - name: Install the pinned toolchain
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install
      # The runner image has the SDK licenses accepted already. No `yes |`:
      # under the default pipefail its SIGPIPE (141) would fail the step.
      - name: Install the pinned NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" < /dev/null > /dev/null
          ls "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          key: android
      - name: Build libonepass_ffi.so (arm64-v8a, x86_64) and check 16 KiB pages
        run: android/scripts/build-core.sh release
      - name: Core and FFI tests in the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ONEPASS_TEST_ABI: x86_64
        with:
          api-level: ${{ env.ANDROID_MIN_API }}
          target: default
          arch: x86_64
          ram-size: 4096M
          disk-size: 6144M
          avd-name: onepass-api29
          script: android/scripts/test-core-emulator.sh

  # The Gradle project (plan X4, Task 2): Kotlin bindings generated from the
  # host build of onepass-ffi, the JVM tests of the bindings (JNA loads the
  # host library), lint, and a debug APK carrying both Android ABIs. Every
  # Gradle dependency is checked against android/gradle/verification-metadata.xml.
  kotlin:
    name: kotlin (Gradle, JVM tests, lint, APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Also validates gradle-wrapper.jar against the published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Pinned versions
        run: |
          . android/scripts/versions.env
          {
            echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION"
            echo "CARGO_NDK_VERSION=$CARGO_NDK_VERSION"
          } >> "$GITHUB_ENV"
      - name: Install the pinned toolchain
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install
      # compileSdk 37 (Android 17) and the pinned NDK; licenses are accepted
      # on the runner image already, so stdin is closed rather than fed `yes`.
      - name: Install the Android platform and the pinned NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ANDROID_NDK_VERSION" < /dev/null > /dev/null
          ls "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          key: android-kotlin
      - name: Bindings tests, lint and debug APK
        working-directory: android
        run: ./gradlew testPlayDebugUnitTest testFdroidDebugUnitTest lintPlayDebug assemblePlayDebug
