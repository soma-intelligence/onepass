name: pinned-actions

on:
  push:
    paths:
      - ".github/**"
      - "scripts/check-pinned-actions.sh"
  pull_request:
    paths:
      - ".github/**"
      - "scripts/check-pinned-actions.sh"

permissions:
  contents: read

jobs:
  pinned-actions:
    name: actions pinned by SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every uses is a full commit SHA
        run: scripts/check-pinned-actions.sh
