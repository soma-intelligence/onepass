name: release

# Builds every release artifact on GitHub's runners, attests their provenance
# (SLSA, actions/attest-build-provenance) and opens a DRAFT release. A human
# reads it and publishes it; nothing here publishes.
#
#   push of a tag v*        full run: build, sign and notarize the Mac app,
#                           checksums, attestations, draft release.
#   workflow_dispatch       dry run on the chosen ref: same builds (the Mac app
#                           only when the signing secrets are there), workflow
#                           artifacts only, no attestation, no release.
#
# Secrets, variables and how to verify a download: docs/security/release-pipeline.md.
# The builds that need no Apple signing run scripts/release-build.sh, so anyone
# can rebuild them and compare (docs/security/reproducible-builds.md).
#
# Security rules for this file: every action pinned by commit SHA
# (scripts/check-pinned-actions.sh), no pull_request_target, no cache (a
# poisoned cache would reach a signed artifact), checkout without persisted
# credentials, permissions per job, secrets only in the steps that use them,
# the tag name read through env and validated before use.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Xcode the Mac app is built with. Change it on purpose, with the runner
  # label of the mac job, and note it in docs/security/reproducible-builds.md.
  XCODE_APP: /Applications/Xcode_27.0.app

jobs:
  meta:
    name: version and source date
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      epoch: ${{ steps.meta.outputs.epoch }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Version and SOURCE_DATE_EPOCH
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          workspace="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' core/Cargo.toml)"
          extension="$(node -p 'require("./extension/package.json").version')"
          manifest="$(node -p 'require("./extension/manifests/base.json").version')"
          apple="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' apple/project.yml)"
          echo "versions: core $workspace, extension $extension, manifest $manifest, apple $apple"
          for v in "$extension" "$manifest" "$apple"; do
            if [ "$v" != "$workspace" ]; then
              echo "::error::versions differ (core $workspace, extension $extension, manifest $manifest, apple $apple)"
              exit 1
            fi
          done
          if [ "$EVENT" = push ]; then
            if [ "$REF_TYPE" != tag ]; then
              echo "::error::a release runs on a tag push only"
              exit 1
            fi
            version="${REF_NAME#v}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::the tag is not v<semver>"
              exit 1
            fi
            # A pre-release tag (v1.2.3-rc.1) may run ahead of the sources.
            if [ "${version%%-*}" != "$workspace" ]; then
              echo "::error::tag v$version does not match the sources ($workspace)"
              exit 1
            fi
            publish=true
          else
            version="$workspace-dryrun.$(git rev-parse --short=12 HEAD)"
            publish=false
          fi
          # Every timestamp a build records comes from the commit, not the clock.
          epoch="$(git log -1 --format=%ct)"
          {
            echo "version=$version"
            echo "epoch=$epoch"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "release $version, SOURCE_DATE_EPOCH $epoch, publish $publish"

  preflight:
    name: dependency gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny,cargo-audit,cargo-vet
      - name: Actions pinned by SHA
        working-directory: .
        run: scripts/check-pinned-actions.sh
      - name: Licenses, bans and sources
        run: cargo deny check
      - name: Supply-chain audits
        run: cargo vet --locked
      - name: Advisories
        run: cargo audit

  extension:
    name: browser extension
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Audit (production dependencies)
        working-directory: extension
        run: npm audit --omit=dev --audit-level=low
      - name: Build Chrome and Firefox zips
        run: scripts/release-build.sh extension "$VERSION" out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-extension
          path: out/*
          if-no-files-found: error

  cli:
    name: cli (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and the target
        working-directory: core
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      # The CLI keeps its Secret Key in the Secret Service on Linux
      # (dbus-secret-service links libdbus-1 through pkg-config).
      - name: Install libdbus-1 headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Build onepass
        run: scripts/release-build.sh cli "$VERSION" out "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cli-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # Rebuilds the extension and the Linux CLI from a second checkout at another
  # path, on another runner, and requires the same bytes. A difference stops
  # the release: fix it, or document it in docs/security/reproducible-builds.md
  # and drop the artifact from this check on purpose.
  rebuild:
    name: reproducibility check
    needs: [meta, extension, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: second/tree/onepass
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the pinned toolchain
        working-directory: second/tree/onepass/core
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-gnu
      - name: Install libdbus-1 headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Rebuild
        working-directory: second/tree/onepass
        run: |
          scripts/release-build.sh extension "$VERSION" "$RUNNER_TEMP/rebuilt"
          scripts/release-build.sh cli "$VERSION" "$RUNNER_TEMP/rebuilt" x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: first
          merge-multiple: true
      - name: Compare
        run: |
          set -euo pipefail
          status=0
          for f in "OnePass-$VERSION-chrome.zip" "OnePass-$VERSION-firefox.zip" "onepass-$VERSION-x86_64-unknown-linux-gnu"; do
            a="$(sha256sum "first/$f" | cut -d' ' -f1)"
            b="$(sha256sum "$RUNNER_TEMP/rebuilt/$f" | cut -d' ' -f1)"
            if [ "$a" = "$b" ]; then
              echo "reproducible: $f $a"
            else
              echo "::error::not reproducible: $f (first $a, rebuilt $b)"
              status=1
            fi
          done
          exit "$status"

  sbom:
    name: SBOMs (CycloneDX)
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the pinned toolchain
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-cyclonedx@0.5.9
      # The same commands as the SBOM steps of core.yml and extension.yml.
      - name: Rust crates
        run: make -C core sbom
      - name: Extension
        working-directory: extension
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run sbom
      - name: One zip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom" out
          cp core/target/sbom/*.cdx.json extension/sbom/extension.cdx.json "$RUNNER_TEMP/sbom/"
          python3 scripts/deterministic-zip.py "out/OnePass-$VERSION-sbom.zip" "$RUNNER_TEMP/sbom"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom
          path: out/*
          if-no-files-found: error

  mac:
    name: Mac app (Developer ID, notarized)
    needs: meta
    runs-on: macos-26
    timeout-minutes: 150
    # Environment secrets, so its protection rules (who may approve, which
    # refs) gate the signing identity. docs/security/release-pipeline.md.
    environment: release
    permissions:
      contents: read
    outputs:
      built: ${{ steps.signing.outputs.ready }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - name: Signing secrets present
        id: signing
        env:
          HAS_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
          HAS_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          HAS_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_PROFILE_APP: ${{ secrets.MACOS_PROFILE_APP_BASE64 != '' }}
          HAS_PROFILE_AUTOFILL: ${{ secrets.MACOS_PROFILE_AUTOFILL_BASE64 != '' }}
          HAS_ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' }}
          HAS_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID != '' }}
          HAS_ASC_ISSUER: ${{ secrets.ASC_API_ISSUER_ID != '' }}
          # Updates (Sparkle): the public key the app trusts, the private key the appcast job signs with.
          HAS_SPARKLE_PUBLIC: ${{ vars.SPARKLE_ED_PUBLIC_KEY != '' }}
          HAS_SPARKLE_PRIVATE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          missing=()
          [ "$HAS_P12" = true ] || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          [ "$HAS_P12_PASSWORD" = true ] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [ "$HAS_TEAM" = true ] || missing+=(APPLE_TEAM_ID)
          [ "$HAS_PROFILE_APP" = true ] || missing+=(MACOS_PROFILE_APP_BASE64)
          [ "$HAS_PROFILE_AUTOFILL" = true ] || missing+=(MACOS_PROFILE_AUTOFILL_BASE64)
          [ "$HAS_ASC_KEY" = true ] || missing+=(ASC_API_KEY_P8_BASE64)
          [ "$HAS_ASC_KEY_ID" = true ] || missing+=(ASC_API_KEY_ID)
          [ "$HAS_ASC_ISSUER" = true ] || missing+=(ASC_API_ISSUER_ID)
          [ "$HAS_SPARKLE_PUBLIC" = true ] || missing+=("SPARKLE_ED_PUBLIC_KEY (variable)")
          [ "$HAS_SPARKLE_PRIVATE" = true ] || missing+=(SPARKLE_ED_PRIVATE_KEY)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          msg="Mac app not built: signing secrets missing from the release environment (${missing[*]}). See docs/security/release-pipeline.md."
          # The project's own tag must ship a signed app; a fork or a dry run
          # goes on without it.
          if [ "$PUBLISH" = true ] && [ "$REPOSITORY" = soma-intelligence/onepass ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.signing.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: Select Xcode
        if: steps.signing.outputs.ready == 'true'
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install the pinned toolchain and the Apple targets
        if: steps.signing.outputs.ready == 'true'
        working-directory: core
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim \
            aarch64-apple-watchos aarch64-apple-watchos-sim aarch64-apple-visionos aarch64-apple-visionos-sim
          # Cargo.lock must already be complete: no build below may change it.
          cargo metadata --locked --format-version 1 > /dev/null

      - name: Temporary keychain with the Developer ID certificate
        if: steps.signing.outputs.ready == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Apple's Developer ID intermediate, checked against its fingerprint.
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q '"Developer ID Application: '; then
            echo "::error::no valid Developer ID Application identity in MACOS_CERTIFICATE_P12_BASE64"
            exit 1
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Provisioning profiles, export options, API key
        if: steps.signing.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_APP: ${{ secrets.MACOS_PROFILE_APP_BASE64 }}
          PROFILE_AUTOFILL: ${{ secrets.MACOS_PROFILE_AUTOFILL_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          install_profile() {
            local b64="$1" bundle="$2" file uuid app_id
            file="$RUNNER_TEMP/$bundle.provisionprofile"
            printf '%s' "$b64" | base64 --decode > "$file"
            security cms -D -i "$file" > "$file.plist"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$file.plist")"
            app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$file.plist")"
            if [ "$app_id" != "$TEAM_ID.$bundle" ]; then
              echo "::error::the profile given for $bundle is for another App ID"
              exit 1
            fi
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$file" "$dir/$uuid.provisionprofile"
            done
            echo "$uuid"
          }
          app_uuid="$(install_profile "$PROFILE_APP" me.somalabs.onepass)"
          autofill_uuid="$(install_profile "$PROFILE_AUTOFILL" me.somalabs.onepass.autofill)"
          # Overrides for every target of the archive (xcodebuild -xcconfig).
          # The Safari extension carries no restricted entitlement, so no profile.
          cat > "$RUNNER_TEMP/release.xcconfig" <<EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Developer ID Application
          DEVELOPMENT_TEAM = $TEAM_ID
          OTHER_CODE_SIGN_FLAGS = --timestamp --keychain $KEYCHAIN
          ONEPASS_PROFILE_OnePass = $app_uuid
          ONEPASS_PROFILE_OnePassAutoFill = $autofill_uuid
          PROVISIONING_PROFILE_SPECIFIER = \$(ONEPASS_PROFILE_\$(TARGET_NAME))
          EOF
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>me.somalabs.onepass</key><string>$app_uuid</string>
              <key>me.somalabs.onepass.autofill</key><string>$autofill_uuid</string>
            </dict>
          </dict>
          </plist>
          EOF
          printf '%s' "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/asc_api_key.p8"

      - name: Rust core (XCFramework)
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/onepass --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup"
          apple/scripts/build-core.sh shipped

      # CFBundleVersion = the tag's numeric core (Sparkle compares it), and the update public key,
      # on the command line: a base64 key may hold "//", which an xcconfig reads as a comment.
      # apple/scripts/check-update-key.sh fails the archive if the key is not 32 bytes.
      - name: Archive (Release-CloudKit, Developer ID)
        if: steps.signing.outputs.ready == 'true'
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/onepass --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup"
          xcodebuild archive \
            -project apple/OnePass.xcodeproj -scheme OnePass \
            -configuration Release-CloudKit \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/OnePass.xcarchive" \
            -xcconfig "$RUNNER_TEMP/release.xcconfig" \
            -onlyUsePackageVersionsFromResolvedFile \
            CURRENT_PROJECT_VERSION="${VERSION%%-*}" \
            ONEPASS_SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY"
          git diff --exit-code -- core/Cargo.lock

      - name: Export (developer-id)
        if: steps.signing.outputs.ready == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OnePass.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/export/OnePass.app"

      - name: Notarize and staple
        if: steps.signing.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/OnePass.app"
          KEY="$RUNNER_TEMP/asc_api_key.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 2h --output-format json > "$RUNNER_TEMP/notary.json"
          id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")"
          echo "notarization $id: $status"
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$id" --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            echo "::error::notarization $status"
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          mkdir -p out
          ditto -c -k --keepParent "$APP" "out/OnePass-$VERSION-mac.zip"
          shasum -a 256 out/*

      - name: Remove the keychain and the keys
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/asc_api_key.p8" "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/release.xcconfig" \
            "$RUNNER_TEMP"/*.provisionprofile "$RUNNER_TEMP"/*.provisionprofile.plist
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.signing.outputs.ready == 'true'
        with:
          name: release-mac
          path: out/*
          if-no-files-found: error

  # The Sparkle feed of the Mac app (docs/security/release-pipeline.md, "Mises à jour de l'app
  # Mac"): signs the notarized zip and the feed with the update key, after checking that the app
  # trusts that key and carries this version. Its own job, so the private key never reaches the
  # runner that builds. Once the release is published as Latest, every installed Mac app finds it
  # at releases/latest/download/appcast.xml.
  appcast:
    name: signed update feed (Sparkle)
    needs: [meta, mac]
    if: needs.mac.outputs.built == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tests of the appcast script
        run: |
          openssl version
          python3 -I scripts/test_appcast.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-mac
          path: mac
      - name: Sign the archive and the feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out
          zip="mac/OnePass-$VERSION-mac.zip"
          python3 -I scripts/appcast.py build --version "$VERSION" --archive "$zip" \
            --download-url "https://github.com/$REPOSITORY/releases/download/v$VERSION/OnePass-$VERSION-mac.zip" \
            --release-url "https://github.com/$REPOSITORY/releases/tag/v$VERSION" \
            --out out/appcast.xml
          python3 -I scripts/appcast.py verify --appcast out/appcast.xml --archive "$zip" --public-key "$SPARKLE_PUBLIC_KEY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-appcast
          path: out/appcast.xml
          if-no-files-found: error

  attest:
    name: checksums and provenance
    needs: [meta, preflight, extension, cli, rebuild, sbom, mac, appcast]
    # appcast is skipped when no Mac app was built (fork, dry run without secrets); a failure of
    # any job still stops here.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          export LC_ALL=C
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      # One SLSA build provenance statement whose subjects are every file,
      # SHA256SUMS included, signed through Sigstore with this workflow's
      # identity. Tag runs only: a dry run attests nothing.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.meta.outputs.publish == 'true'
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-${{ needs.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    name: draft release
    needs: [meta, attest]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: final-${{ needs.meta.outputs.version }}
          path: dist
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          # A suffixed tag (v0.3.0-rc.1) is a pre-release: never Latest, so never offered to the
          # Mac app's updater. Any other version, 0.x included, becomes Latest once published.
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Draft built by the release workflow from tag v$VERSION. Review it, write the notes, then publish.

          ## Verify a download

          \`\`\`sh
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify <file> --repo $GH_REPO --signer-workflow $GH_REPO/.github/workflows/release.yml
          \`\`\`

          The command line binaries (onepass-$VERSION-*) are the development CLI: not for real secrets yet. See docs/security/release-pipeline.md.

          appcast.xml is the signed update feed of the Mac app: publishing this release as Latest offers OnePass $VERSION to every installed Mac app (with the user's approval).
          EOF
          gh release create "v$VERSION" --draft --verify-tag "${prerelease[@]}" \
            --title "OnePass $VERSION" --notes-file "$RUNNER_TEMP/notes.md" dist/*
