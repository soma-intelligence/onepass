name: extension

on:
  push:
    paths:
      - "extension/**"
      - "core/onepass-bridge/**"
      - "core/onepass-native-host/**"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "extension/**"
      - "core/onepass-bridge/**"
      - "core/onepass-native-host/**"
      - ".github/workflows/extension.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  extension:
    name: extension (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # rustup reads core/rust-toolchain.toml (pinned toolchain); the e2e
      # global setup builds the native host with it.
      - name: Install the pinned Rust toolchain
        working-directory: core
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, unit tests, build
        run: npm run check
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - name: End-to-end tests
        run: npm run e2e -- --reporter=list,html
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            extension/playwright-report
            extension/test-results
          if-no-files-found: ignore
