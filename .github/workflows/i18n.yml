name: i18n

# Fails on a missing translation, a placeholder mismatch, an incomplete plural, glossary drift,
# an em dash or a leftover tr() call in the extension. Rules: docs/i18n.md.
on:
  push:
    paths:
      - "**/*.xcstrings"
      - "extension/src/shared/l10n/**"
      - "extension/src/_locales/**"
      - "extension/src/**/*.ts"
      - "scripts/i18n/**"
      - "apple/scripts/core_labels/**"
      - ".github/workflows/i18n.yml"
  pull_request:
    paths:
      - "**/*.xcstrings"
      - "extension/src/shared/l10n/**"
      - "extension/src/_locales/**"
      - "extension/src/**/*.ts"
      - "scripts/i18n/**"
      - "apple/scripts/core_labels/**"
      - ".github/workflows/i18n.yml"

permissions:
  contents: read

jobs:
  check:
    name: i18n check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tool tests
        run: python3 -I scripts/i18n/test_i18n.py
      - name: Catalogs
        run: python3 -I scripts/i18n/i18n.py check
