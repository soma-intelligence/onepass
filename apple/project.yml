# OnePass app (iPhone, iPad, native Mac). Generate with `make -C apple project`
# (xcodegen generate); the generated OnePass.xcodeproj is committed (ruling R15).
name: OnePass

options:
  bundleIdPrefix: me.somalabs
  developmentLanguage: fr
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
    visionOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release
  Release-CloudKit: release
  # Signed without CloudKit: the shared keychain group only (a restricted entitlement, so a
  # provisioning profile is required; ad hoc builds never carry it).
  Release-Signed: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Typed symbols for manual String Catalog keys: Text(.settingsTitle) (docs/i18n.md).
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Signing identity, as build settings only (a personal team overrides them, see
    # scripts/install-iphone.sh; never edit an entitlements file or a bundle id below for it).
    # Bundle id base: the app; its extensions and the watch app add a suffix.
    ONEPASS_BUNDLE_ID_PREFIX: me.somalabs.onepass
    # App Group of the app, the AutoFill extension, the widgets and the notification extension:
    # every entitlements file names `$(ONEPASS_APP_GROUP)`, the code reads the Info.plist key
    # `OnePassAppGroup`.
    ONEPASS_APP_GROUP: group.me.somalabs.onepass
    "ONEPASS_APP_GROUP[sdk=macosx*]": $(TeamIdentifierPrefix)me.somalabs.onepass
    # Shared keychain access group after the team prefix, for the app and the AutoFill extension.
    # The only place to change it (a fork or a personal team): every entitlements file names
    # `$(AppIdentifierPrefix)$(ONEPASS_KEYCHAIN_GROUP)` and the code reads the Info.plist key
    # `OnePassKeychainGroup`, so the signature and the code always agree (scripts/check-signing-groups.sh
    # fails the build otherwise). Existing users' items live in the default: never change it here.
    ONEPASS_KEYCHAIN_GROUP: me.somalabs.onepass.shared
    # CloudKit container of the CloudKit entitlements and of the Info.plist key `OnePassCloudKitContainer`.
    ONEPASS_CLOUDKIT_CONTAINER: iCloud.me.somalabs.onepass
    # Chrome and Firefox extension ids the Mac app's bridge serves (Info.plist key
    # `OnePassBrowserExtensions`, space separated; Safari is always served). Add the Chrome id
    # (Web Store, or the unpacked one while testing) here.
    ONEPASS_BROWSER_EXTENSIONS: onepass@somalabs.me
    # Mac app updates (Sparkle, spec 2026-11-02-mac-updater-design.md): the signed appcast of the
    # release GitHub marks Latest, and the base64 Ed25519 public key it must be signed with. Empty
    # key = no updater (development builds); a Developer ID build without a valid key fails
    # (scripts/check-update-key.sh). The release workflow passes the key on the command line.
    ONEPASS_UPDATE_FEED_URL: https://github.com/soma-intelligence/onepass/releases/latest/download/appcast.xml
    ONEPASS_SPARKLE_PUBLIC_KEY: ""

packages:
  VaultKit:
    path: VaultKit
  DesignKit:
    path: DesignKit
  CompanionKit:
    path: CompanionKit
  SafariRelay:
    path: SafariExtension/SafariRelay
  UpdateKit:
    path: UpdateKit

targets:
  OnePass:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: App
        excludes:
          - "Support/Info.plist"
          - "Support/*.entitlements"
    dependencies:
      - package: VaultKit
        product: VaultKit
      - package: DesignKit
        product: DesignKit
      # The iOS app carries the watch app; the Mac build has no watch content.
      - target: OnePassWatch
        destinationFilters: [iOS]
      - package: CompanionKit
        product: GlanceKit
      - package: CompanionKit
        product: CompanionLink
      # Widgets and Controls: iPhone and iPad only.
      - target: OnePassWidgets
        destinationFilters: [iOS]
      # The alert of an agent request (time sensitive, Mac name): iPhone and iPad only.
      - target: OnePassNotifications
        destinationFilters: [iOS]
      # AutoFill credential provider: iPhone, iPad and Mac (no visionOS slice).
      - target: OnePassAutoFill
        destinationFilters: [iOS, macOS]
      # Safari Web Extension: Mac only for now (the iOS one needs the bridge in the app, R-17).
      - target: OnePassSafari
        destinationFilters: [macOS]
      # Updates from GitHub Releases (Sparkle): the Developer ID Mac app only.
      - package: UpdateKit
        product: UpdateKit
        destinationFilters: [macOS]
    # Entitlements and code share ONEPASS_KEYCHAIN_GROUP and ONEPASS_APP_GROUP: a hardcoded group
    # fails the build.
    preBuildScripts:
      - name: Check signing groups
        basedOnDependencyAnalysis: false
        script: '"${PROJECT_DIR}/scripts/check-signing-groups.sh"'
      # A Developer ID Mac build must carry the update key and an https feed.
      - name: Check update key
        basedOnDependencyAnalysis: false
        script: '"${PROJECT_DIR}/scripts/check-update-key.sh"'
    # Chrome and Firefox native messaging host (Contents/Helpers/onepass-relay): signed Mac builds.
    postBuildScripts:
      - name: Embed browser relay
        basedOnDependencyAnalysis: false
        script: '"${PROJECT_DIR}/scripts/embed-relay.sh"'
      # The MCP relay MCP clients launch (Contents/Helpers/onepass-mcp, macOS only).
      - name: Embed MCP relay
        basedOnDependencyAnalysis: false
        script: '"${PROJECT_DIR}/scripts/embed-mcp-relay.sh"'
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: OnePass
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.productivity
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        OnePassKeychainGroup: $(ONEPASS_KEYCHAIN_GROUP)
        OnePassAppGroup: $(ONEPASS_APP_GROUP)
        OnePassCloudKitContainer: $(ONEPASS_CLOUDKIT_CONTAINER)
        OnePassBrowserExtensions: $(ONEPASS_BROWSER_EXTENSIONS)
        # Credential Exchange import: the system hands the export to the app through this activity.
        NSUserActivityTypes: [ASCredentialExchangeActivity]
        # Sparkle (Mac, Developer ID): signed feed and archive, verified before extraction, no
        # system profile, a check every 24 hours, installs only after the user's yes, installer
        # through Sparkle's XPC service (sandbox). Read by UpdateKit's UpdateConfiguration; the
        # other platforms ignore them.
        SUFeedURL: $(ONEPASS_UPDATE_FEED_URL)
        SUPublicEDKey: $(ONEPASS_SPARKLE_PUBLIC_KEY)
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
        SUEnableInstallerLauncherService: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app ships its own cryptography; export compliance is settled before submission (README).
        ITSAppUsesNonExemptEncryption: true
        NSFaceIDUsageDescription: "OnePass utilise Face ID pour déverrouiller ton coffre sans retaper ton mot de passe maître."
        NSCameraUsageDescription: "OnePass utilise la caméra pour lire le QR code de ton Emergency Kit, celui d'un nouvel appareil ou celui d'un code de vérification."
        # Pairing (milestone 2b): the new device publishes a Bonjour service, the approver finds it.
        NSLocalNetworkUsageDescription: "OnePass utilise le réseau local pour ajouter un appareil à ton compte, sans passer par un serveur."
        NSBonjourServices: [_onepass-pair._tcp]
        # Asked only on "Utiliser ma position" or when "À proximité" opens (macOS reads NSLocationUsageDescription).
        NSLocationWhenInUseUsageDescription: "OnePass utilise ta position pour placer un lieu sur un élément et pour lister les éléments à proximité. Elle reste sur cet appareil."
        NSLocationUsageDescription: "OnePass utilise ta position pour placer un lieu sur un élément et pour lister les éléments à proximité. Elle reste sur cet appareil."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # CloudKit pushes: sync rounds, and the agent requests of the Mac (agent-ready spec 5.2).
        # The Push Notifications capability is `aps-environment` in the CloudKit entitlements.
        UIBackgroundModes: [remote-notification]
        # Deep links from the widgets and Controls (GlanceKit `OnePassLink`), and the verification
        # code links: declaring `otpauth` lists OnePass in Réglages > Codes de vérification >
        # "Configurer les codes dans" (`otpauth-migration` is the Google Authenticator export).
        CFBundleURLTypes:
          - CFBundleURLName: me.somalabs.onepass
            CFBundleURLSchemes: [onepass]
          - CFBundleURLName: me.somalabs.onepass.otpauth
            CFBundleURLSchemes: [otpauth, otpauth-migration]
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ONEPASS_BUNDLE_ID_PREFIX)
        PRODUCT_NAME: OnePass
        TARGETED_DEVICE_FAMILY: "1,2,7"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        "ARCHS[sdk=macosx*]": arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Support/OnePass.entitlements
        # iOS, every configuration: App Group (shared with the AutoFill extension and the widgets),
        # shared keychain group, AutoFill provider. A simulator build signed ad hoc embeds them
        # (Xcode injects a prefix for the keychain group).
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": App/Support/OnePass-iOS.entitlements
      configs:
        Release-CloudKit:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ONEPASS_CLOUDKIT"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          # Fill in the Apple team to sign this configuration (iCloud, shared keychain group, push).
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_ENTITLEMENTS: App/Support/OnePass-CloudKit.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Support/OnePass-CloudKit-macOS.entitlements
          # Overrides the base iOS file (the CloudKit file carries the App Group too).
          "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": App/Support/OnePass-CloudKit.entitlements
        Release-Signed:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          # Fill in the Apple team: keychain-access-groups needs a provisioning profile.
          DEVELOPMENT_TEAM: ""
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Support/OnePass-Signed-macOS.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": App/Support/OnePass-Signed-iOS.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=xr*]": App/Support/OnePass-Signed-iOS.entitlements

  # AutoFill credential provider (spec 5), embedded in OnePass.app/PlugIns. Links its own static
  # copy of the Rust core through VaultKit (ruling A15). Entitlements: iOS, every configuration:
  # App Group, keychain group, provider; macOS Debug and Release: sandbox only (an ad hoc build
  # cannot carry the restricted entitlements); macOS Release-CloudKit: all of them.
  OnePassAutoFill:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AutoFill
        excludes:
          - "Support/Info.plist"
          - "Support/*.entitlements"
    dependencies:
      - package: VaultKit
        product: VaultKit
      - package: DesignKit
        product: DesignKit
    info:
      path: AutoFill/Support/Info.plist
      properties:
        CFBundleDisplayName: OnePass
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        OnePassKeychainGroup: $(ONEPASS_KEYCHAIN_GROUP)
        OnePassAppGroup: $(ONEPASS_APP_GROUP)
        NSFaceIDUsageDescription: "OnePass utilise Face ID pour remplir tes mots de passe sans retaper ton mot de passe maître."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            # One Info.plist for both platforms: macOS has no text insertion and ignores
            # ProvidesTextToInsert. The 26.2 save and generate keys are ignored before 26.2.
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
              ProvidesTextToInsert: true
              ShowsConfigurationUI: true
              SupportsSavePasswordCredentials: true
              SupportsGeneratePasswordCredentials: true
              # Credential Exchange (CXP 1.0): Passwords exports to OnePass, and the reverse.
              SupportsCredentialExchange: true
              SupportedCredentialExchangeVersions: ["1.0"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ONEPASS_BUNDLE_ID_PREFIX).autofill
        PRODUCT_NAME: OnePassAutoFill
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        "ARCHS[sdk=macosx*]": arm64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": AutoFill/Support/OnePassAutoFill-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": AutoFill/Support/OnePassAutoFill-macOS.entitlements
      configs:
        Release-CloudKit:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ONEPASS_CLOUDKIT"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": AutoFill/Support/OnePassAutoFill-macOS-CloudKit.entitlements
        # Signed without CloudKit (milestone 2): the extension carries no iCloud entitlement, so the
        # signed Mac file of Release-CloudKit serves here too (App Group, keychain group, provider).
        Release-Signed:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": AutoFill/Support/OnePassAutoFill-macOS-CloudKit.entitlements

  # Safari Web Extension (spec milestone 4, R-02, R-08), embedded in OnePass.app/PlugIns on the
  # Mac. Resources = extension/dist/safari (`cd extension && npm run build` first). Its handler
  # relays `browser.runtime.sendNativeMessage` to the bridge host with the same frames as Chrome's
  # native messaging: the app's bridge socket in its App Group container (signed builds, spec
  # 2026-10-27-release-bridge-design), and in Debug first the embedded development native host
  # (core/onepass-native-host). Release configurations embed no development host.
  # Entitlements: Debug and Release sandbox only; Release-CloudKit and Release-Signed add the App
  # Group (the rendezvous with the app).
  OnePassSafari:
    type: app-extension
    platform: macOS
    sources:
      - path: SafariExtension
        excludes:
          - "SafariRelay/**"
          - "scripts/**"
          - "Support/Info.plist"
          - "Support/*.entitlements"
    dependencies:
      - package: SafariRelay
        product: SafariRelay
    info:
      path: SafariExtension/Support/Info.plist
      properties:
        CFBundleDisplayName: OnePass
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    postBuildScripts:
      - name: Copy web extension
        basedOnDependencyAnalysis: false
        script: '"${PROJECT_DIR}/SafariExtension/scripts/copy-web-extension.sh"'
        # Declared so the appex is signed again after the copy: without it an incremental build
        # that only changes extension/dist left the seal broken and Safari did not load it.
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/manifest.json
      - name: Embed development native host
        basedOnDependencyAnalysis: false
        script: '"${PROJECT_DIR}/SafariExtension/scripts/embed-dev-host.sh"'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ONEPASS_BUNDLE_ID_PREFIX).safari
        PRODUCT_NAME: OnePassSafari
        "ARCHS[sdk=macosx*]": arm64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: SafariExtension/Support/OnePassSafari-macOS.entitlements
        # YES embeds core/onepass-native-host (development host, DEV MODE): Debug only.
        ONEPASS_SAFARI_DEV_HOST: NO
      configs:
        Debug:
          ONEPASS_SAFARI_DEV_HOST: YES
        Release-CloudKit:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ONEPASS_CLOUDKIT"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_ENTITLEMENTS: SafariExtension/Support/OnePassSafari-macOS-Signed.entitlements
        Release-Signed:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_ENTITLEMENTS: SafariExtension/Support/OnePassSafari-macOS-Signed.entitlements

  # Test host for the AutoFill UI test (ruling A16): a sign-in form with username, password and
  # one-time code fields. iOS only, never embedded in OnePass, never shipped.
  AutoFillHost:
    type: application
    platform: iOS
    sources:
      - path: AutoFillHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.onepass.autofillhost
        PRODUCT_NAME: AutoFillHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Hôte AutoFill"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  # XCUITest, iPhone simulator `OnePass M2 iPhone` (`make -C apple uitest`). The screenshot
  # tests in the same bundle are skipped unless `scripts/screenshots.sh` runs them.
  OnePassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
        excludes:
          - "AutoFillUITests.swift"
    dependencies:
      - target: OnePass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.onepass.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: OnePass
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  # Apple Watch app (milestone 6): codes and items marked "Sur l'Apple Watch", sent by the
  # iPhone sealed to the watch key (CompanionLink). Embedded in the iOS app.
  OnePassWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - "Info.plist"
    dependencies:
      - package: CompanionKit
        product: CompanionLink
      - package: VaultKit
        product: OnePassCore
      - target: OnePassWatchWidgets
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: OnePass
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: true
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(ONEPASS_BUNDLE_ID_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ONEPASS_BUNDLE_ID_PREFIX).watchkitapp
        PRODUCT_NAME: OnePassWatch
        "ARCHS[sdk=watchos*]": arm64
        # The core XCFramework has no x86_64 watch simulator slice.
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": x86_64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
      configs:
        Release-CloudKit:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""
        Release-Signed:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""

  # Complication and Smart Stack card (glyph and name only, no vault data).
  OnePassWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
        excludes:
          - "Info.plist"
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: OnePass
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ONEPASS_BUNDLE_ID_PREFIX).watchkitapp.widgets
        PRODUCT_NAME: OnePassWatchWidgets
        "ARCHS[sdk=watchos*]": arm64
        # The core XCFramework has no x86_64 watch simulator slice.
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
      configs:
        Release-CloudKit:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""
        Release-Signed:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""

  # iPhone and iPad widgets ("Codes", "Favoris") and Controls (spec 7 and 8). Reads the App
  # Group snapshot through GlanceKit only: no Rust core in the extension.
  OnePassWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: CompanionKit
        product: GlanceKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: OnePass
        OnePassAppGroup: $(ONEPASS_APP_GROUP)
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ONEPASS_BUNDLE_ID_PREFIX).widgets
        PRODUCT_NAME: OnePassWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Widgets/OnePassWidgets.entitlements
      configs:
        Release-CloudKit:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""
        Release-Signed:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""

  # Notification Service Extension (agent-ready spec 5.2), embedded in the iOS app: makes the
  # CloudKit alert of an agent request time sensitive and names the Mac from the App Group (names
  # the app writes). No vault data, no Rust core, no action in the notification.
  OnePassNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - "Info.plist"
          - "*.entitlements"
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: OnePass
        OnePassAppGroup: $(ONEPASS_APP_GROUP)
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ONEPASS_BUNDLE_ID_PREFIX).notifications
        PRODUCT_NAME: OnePassNotifications
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # A personal install without the App Group on this extension's App ID passes the variant
        # without the group (scripts/install-iphone.sh); the alert then omits the Mac's name.
        ONEPASS_NOTIFICATIONS_ENTITLEMENTS: NotificationService/OnePassNotifications.entitlements
        CODE_SIGN_ENTITLEMENTS: $(ONEPASS_NOTIFICATIONS_ENTITLEMENTS)
      configs:
        Release-CloudKit:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""
        Release-Signed:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: ""

  # XCUITest of the AutoFill extension on `OnePass M3 iPhone` (`make -C apple uitest-autofill`):
  # drives AutoFillHost; OnePass (with its extension) is installed beside it by the Makefile.
  OnePassAutoFillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests/AutoFillUITests.swift
      - path: AppUITests/RunThroughUITests.swift
    dependencies:
      - target: AutoFillHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.onepass.autofilluitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: AutoFillHost
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  OnePass:
    build:
      targets:
        OnePass: all
      # Before the build, so before the Swift packages that link the XCFramework. The XCFramework
      # and the Swift bindings are generated, not committed (ruling R17). On a fresh clone, run
      # `make -C apple core` first: Xcode resolves packages when the project opens.
      preActions:
        - name: Build Rust core
          settingsTarget: OnePass
          script: |
            if [ ! -d "${PROJECT_DIR}/build/OnePassFFI.xcframework" ]; then
              make -C "${PROJECT_DIR}" core
            fi
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OnePassUITests
    archive:
      config: Release
  OnePassWatch:
    build:
      targets:
        OnePassWatch: all
      preActions:
        - name: Build Rust core
          settingsTarget: OnePassWatch
          script: |
            if [ ! -d "${PROJECT_DIR}/build/OnePassFFI.xcframework" ]; then
              make -C "${PROJECT_DIR}" core
            fi
    run:
      config: Debug
      commandLineArguments:
        "-OnePassWatchDemo YES": false
    archive:
      config: Release

  # Builds OnePass (with its AutoFill extension) and AutoFillHost, tests the AutoFill UI.
  OnePassAutoFill:
    build:
      targets:
        OnePass: all
        AutoFillHost: all
      preActions:
        - name: Build Rust core
          settingsTarget: OnePass
          script: |
            if [ ! -d "${PROJECT_DIR}/build/OnePassFFI.xcframework" ]; then
              make -C "${PROJECT_DIR}" core
            fi
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OnePassAutoFillUITests
    archive:
      config: Release
