# OnePass app (iPhone, iPad, native Mac). Generate with `make -C apple project`
# (xcodegen generate); the generated OnePass.xcodeproj is committed (ruling R15).
name: OnePass

options:
  bundleIdPrefix: me.somalabs
  developmentLanguage: fr
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release
  Release-CloudKit: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  VaultKit:
    path: VaultKit
  DesignKit:
    path: DesignKit
  CompanionKit:
    path: CompanionKit

targets:
  OnePass:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "Support/Info.plist"
          - "Support/*.entitlements"
    dependencies:
      - package: VaultKit
        product: VaultKit
      - package: DesignKit
        product: DesignKit
      # The iOS app carries the watch app; the Mac build has no watch content.
      - target: OnePassWatch
        destinationFilters: [iOS]
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: OnePass
        CFBundleDevelopmentRegion: fr
        LSApplicationCategoryType: public.app-category.productivity
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app ships its own cryptography; export compliance is settled before submission (README).
        ITSAppUsesNonExemptEncryption: true
        NSFaceIDUsageDescription: "OnePass utilise Face ID pour déverrouiller ton coffre sans retaper ton mot de passe maître."
        NSCameraUsageDescription: "OnePass utilise la caméra pour lire le QR code de ton Emergency Kit."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.onepass
        PRODUCT_NAME: OnePass
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        "ARCHS[sdk=macosx*]": arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Support/OnePass.entitlements
      configs:
        Release-CloudKit:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ONEPASS_CLOUDKIT"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          # Fill in the Apple team to sign this configuration (iCloud, shared keychain group, push).
          DEVELOPMENT_TEAM: ""
          CODE_SIGN_ENTITLEMENTS: App/Support/OnePass-CloudKit.entitlements
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Support/OnePass-CloudKit-macOS.entitlements

  # XCUITest, iPhone simulator `OnePass M2 iPhone` (`make -C apple uitest`). The screenshot
  # tests in the same bundle are skipped unless `scripts/screenshots.sh` runs them.
  OnePassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: OnePass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.onepass.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: OnePass
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  # Apple Watch app (milestone 6): codes and items marked "Sur l'Apple Watch", sent by the
  # iPhone sealed to the watch key (CompanionLink). Embedded in the iOS app.
  OnePassWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - "Info.plist"
    dependencies:
      - package: CompanionKit
        product: CompanionLink
      - package: VaultKit
        product: OnePassCore
      - target: OnePassWatchWidgets
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: OnePass
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: true
        WKApplication: true
        WKCompanionAppBundleIdentifier: me.somalabs.onepass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.onepass.watchkitapp
        PRODUCT_NAME: OnePassWatch
        "ARCHS[sdk=watchos*]": arm64
        # The core XCFramework has no x86_64 watch simulator slice.
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": x86_64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  # Complication and Smart Stack card (glyph and name only, no vault data).
  OnePassWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
        excludes:
          - "Info.plist"
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: OnePass
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.somalabs.onepass.watchkitapp.widgets
        PRODUCT_NAME: OnePassWatchWidgets
        "ARCHS[sdk=watchos*]": arm64
        # The core XCFramework has no x86_64 watch simulator slice.
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  OnePass:
    build:
      targets:
        OnePass: all
      # Before the build, so before the Swift packages that link the XCFramework. The XCFramework
      # and the Swift bindings are generated, not committed (ruling R17). On a fresh clone, run
      # `make -C apple core` first: Xcode resolves packages when the project opens.
      preActions:
        - name: Build Rust core
          settingsTarget: OnePass
          script: |
            if [ ! -d "${PROJECT_DIR}/build/OnePassFFI.xcframework" ]; then
              make -C "${PROJECT_DIR}" core
            fi
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OnePassUITests
    archive:
      config: Release
  OnePassWatch:
    build:
      targets:
        OnePassWatch: all
      preActions:
        - name: Build Rust core
          settingsTarget: OnePassWatch
          script: |
            if [ ! -d "${PROJECT_DIR}/build/OnePassFFI.xcframework" ]; then
              make -C "${PROJECT_DIR}" core
            fi
    run:
      config: Debug
      commandLineArguments:
        "-OnePassWatchDemo YES": false
    archive:
      config: Release
