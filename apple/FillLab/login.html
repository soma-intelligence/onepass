<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>FillLab web login</title>
<style>
  body { font: 13px -apple-system, sans-serif; margin: 12px; color: CanvasText; background: Canvas; }
  label { display: block; margin: 10px 0 4px; }
  input { width: 280px; font: inherit; padding: 4px; }
</style>
</head>
<body>
<p>FillLab web login (local test page, nothing is sent).</p>
<form onsubmit="return false">
  <label for="login">Username or email</label>
  <input id="login" name="login" type="text" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
</form>
</body>
</html>
