<!doctype html>
<html lang="en"><head><title>Sign In | Example</title></head>
<body><main><form action="/session">
<div class="float"><input type="email" name="user_email" id="em" placeholder="you@example" autocomplete="username" required><label for="em">Email address</label></div>
<div class="float"><input type="password" name="pw" id="pw" aria-label="Your secret" maxlength="64" pattern=".{8,}"><label for="pw">Password</label></div>
<p>Forgot it?</p>
<button type="submit">Sign In</button><input type="submit" value="Go">
</form></main></body></html>
