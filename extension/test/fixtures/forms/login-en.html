<!doctype html>
<html lang="en"><head><title>Atlas Cloud - Sign in</title></head>
<body>
  <h1>Sign in to Atlas Cloud</h1>
  <form id="login" action="/session" method="post">
    <label for="u">Email or username</label>
    <input id="u" name="login" type="text">
    <label for="p">Password</label>
    <input id="p" name="pass" type="password">
    <label><input id="remember" type="checkbox" name="remember"> Remember me</label>
    <a href="/forgot">Forgot your password?</a>
    <button id="submit" type="submit">Sign in</button>
  </form>
</body></html>
