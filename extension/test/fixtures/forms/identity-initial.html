<!doctype html>
<html lang="en"><head><title>Atlas Cloud - Profile</title></head>
<body>
  <form id="profile" action="/profile" method="post">
    <label for="fn">First name</label><input id="fn" name="first" type="text">
    <label for="mi">M.I.</label><input id="mi" name="mi" type="text" maxlength="1">
    <label for="ln">Last name</label><input id="ln" name="last" type="text">
    <label for="tel">Phone</label><input id="tel" name="phone" type="tel">
    <button id="submit" type="submit">Save</button>
  </form>
</body></html>
