<!doctype html>
<html lang="en"><head><title>Atlas Cloud - Two-step verification</title></head>
<body>
  <form id="otp" action="/verify" method="post">
    <p>Enter the 6-digit code</p>
    <div class="cells">
      <input id="c1" type="text" inputmode="numeric" maxlength="1">
      <input id="c2" type="text" inputmode="numeric" maxlength="1">
      <input id="c3" type="text" inputmode="numeric" maxlength="1">
      <input id="c4" type="text" inputmode="numeric" maxlength="1">
      <input id="c5" type="text" inputmode="numeric" maxlength="1">
      <input id="c6" type="text" inputmode="numeric" maxlength="1">
    </div>
    <button id="submit" type="submit">Verify</button>
  </form>
</body></html>
