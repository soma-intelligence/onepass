<!doctype html>
<html lang="en"><head><title>Atlas Cloud - Billing</title></head>
<body>
  <form id="card" action="/billing" method="post">
    <label for="holder">Name on card</label>
    <input id="holder" name="holder" type="text">
    <label for="num">Card number</label>
    <input id="num" name="cardnumber" type="text" inputmode="numeric">
    <label for="mm">Expiration month</label>
    <select id="mm" name="exp_month"><option>01</option><option>12</option></select>
    <label for="yy">Expiration year</label>
    <select id="yy" name="exp_year"><option>2027</option><option>2030</option></select>
    <label for="cvc">Security code</label>
    <input id="cvc" name="cvc" type="text" maxlength="4">
    <button id="submit" type="submit">Pay</button>
  </form>
</body></html>
