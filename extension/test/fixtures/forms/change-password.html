<!doctype html>
<html lang="fr"><head><title>Atlas Cloud - Sécurité</title></head>
<body>
  <form id="change" action="/password" method="post">
    <label for="old">Mot de passe actuel</label>
    <input id="old" name="current" type="password">
    <label for="new">Nouveau mot de passe</label>
    <input id="new" name="new" type="password">
    <label for="again">Confirmer le nouveau mot de passe</label>
    <input id="again" name="again" type="password">
    <button id="submit" type="submit">Enregistrer</button>
  </form>
</body></html>
