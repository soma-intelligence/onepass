<!doctype html>
<html lang="en"><head><title>Atlas Cloud - App</title></head>
<body>
  <div id="app">
    <div id="login-panel" class="panel">
      <h2>Sign in</h2>
      <div><input id="u" type="email" placeholder="Email"></div>
      <div><input id="p" type="password" placeholder="Password"></div>
      <div role="button" id="go" tabindex="0">Log in</div>
    </div>
    <div id="card-panel" class="panel">
      <input id="num" type="text" autocomplete="cc-number">
      <input id="exp" type="text" autocomplete="cc-exp">
    </div>
  </div>
</body></html>
