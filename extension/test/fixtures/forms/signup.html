<!doctype html>
<html lang="en"><head><title>Atlas Cloud - Create account</title></head>
<body>
  <form id="signup" action="/register" method="post">
    <label for="mail">Email</label>
    <input id="mail" name="email" type="email">
    <label for="pw1">Create a password</label>
    <input id="pw1" name="password" type="password">
    <label for="pw2">Confirm password</label>
    <input id="pw2" name="password_confirmation" type="password">
    <button id="submit">Create account</button>
  </form>
</body></html>
