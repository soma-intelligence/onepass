<div class="brand">Atlas Cloud</div>
<h1>Profil</h1>
<form id="profile" action="/profile" method="post">
  <label for="given-name">Prénom</label><input id="given-name" name="given" type="text" autocomplete="given-name">
  <label for="family-name">Nom</label><input id="family-name" name="family" type="text" autocomplete="family-name">
  <label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email">
  <label for="tel">Téléphone</label><input id="tel" name="tel" type="tel" autocomplete="tel">
  <label for="organization">Société</label><input id="organization" name="org" type="text" autocomplete="organization">
  <label for="address-line1">Adresse</label><input id="address-line1" name="a1" type="text" autocomplete="address-line1">
  <label for="postal-code">Code postal</label><input id="postal-code" name="zip" type="text" autocomplete="postal-code">
  <label for="city">Ville</label><input id="city" name="city" type="text" autocomplete="address-level2">
  <button id="submit" type="submit">Enregistrer</button>
</form>
