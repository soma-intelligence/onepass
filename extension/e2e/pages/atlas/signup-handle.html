<div class="brand">Atlas Cloud</div>
<h1>Créer un compte</h1>
<p class="error" id="error">{{error}}</p>
<form id="signup" action="/signup-handle" method="post">
  <label for="full-name">Nom complet</label>
  <input id="full-name" name="name" type="text" autocomplete="name">
  <label for="email">Adresse e-mail</label>
  <input id="email" name="email" type="email" autocomplete="email">
  <label for="username">Nom d'utilisateur</label>
  <input id="username" name="username" type="text" autocomplete="username" pattern="[a-z0-9_.]{3,20}" maxlength="20">
  <label for="new-password">Mot de passe</label>
  <input id="new-password" name="password" type="password" autocomplete="new-password">
  <label for="confirm-password">Confirmer le mot de passe</label>
  <input id="confirm-password" name="confirm" type="password" autocomplete="new-password">
  <button id="submit" type="submit">Créer le compte</button>
</form>
