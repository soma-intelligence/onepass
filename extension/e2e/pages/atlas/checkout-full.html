<div class="brand">Atlas Cloud</div>
<h1>Paiement</h1>
<form id="pay" action="/checkout-full" method="post">
  <label for="cc-name">Nom du titulaire</label>
  <input id="cc-name" name="name" type="text" autocomplete="cc-name">
  <label for="cc-number">Numéro de carte</label>
  <input id="cc-number" name="number" type="text" inputmode="numeric" autocomplete="cc-number">
  <label for="cc-exp">Date d'expiration</label>
  <input id="cc-exp" name="exp" type="text" placeholder="MM/AA" autocomplete="cc-exp">
  <label for="given-name">Prénom</label><input id="given-name" name="given" type="text" autocomplete="given-name">
  <label for="family-name">Nom</label><input id="family-name" name="family" type="text" autocomplete="family-name">
  <label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email">
  <button id="submit" type="submit">Payer</button>
</form>
