<div class="brand">Atlas Cloud</div>
<h1>Réservation de vol</h1>
<form id="travel" action="/travel" method="post">
  <fieldset>
    <legend>Passager 1</legend>
    <label for="given-name">Prénom</label><input id="given-name" name="given" type="text" autocomplete="given-name">
    <label for="family-name">Nom</label><input id="family-name" name="family" type="text" autocomplete="family-name">
    <label for="passport">Numéro de passeport</label><input id="passport" name="passport" type="text">
    <label for="trap-passport">Numéro de passeport</label><input id="trap-passport" name="passport_check" type="text" style="position:absolute; left:-5000px">
    <label for="ghost-passport">Numéro de passeport</label><input id="ghost-passport" name="passport_ghost" type="text" style="opacity:0">
  </fieldset>
  <fieldset>
    <legend>Passager 2</legend>
    <label for="given-name-2">Prénom</label><input id="given-name-2" name="given2" type="text">
    <label for="family-name-2">Nom</label><input id="family-name-2" name="family2" type="text">
    <label for="passport-2">Numéro de passeport</label><input id="passport-2" name="passport2" type="text">
  </fieldset>
  <button id="submit" type="submit">Réserver</button>
</form>
<iframe id="partner" src="https://evil.test/passport-frame" style="width:420px; height:220px; border:1px solid #999"></iframe>
