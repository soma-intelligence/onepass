<div class="brand">Atlas Cloud</div>
<h1>Changer de mot de passe</h1>
<p class="error" id="error">{{error}}</p>
<form id="change" action="/change-password" method="post">
  <label for="email">Adresse e-mail</label>
  <input id="email" name="email" type="email" autocomplete="username" value="{{email}}">
  <label for="current-password">Mot de passe actuel</label>
  <input id="current-password" name="current" type="password" autocomplete="current-password">
  <label for="new-password">Nouveau mot de passe</label>
  <input id="new-password" name="password" type="password" autocomplete="new-password">
  <label for="confirm-password">Confirmer le nouveau mot de passe</label>
  <input id="confirm-password" name="confirm" type="password" autocomplete="new-password">
  <button id="submit" type="submit">Enregistrer</button>
</form>
