<div class="brand">Atlas Cloud</div>
<h1>Connexion</h1>
<form id="decoy" action="/decoy" method="post" style="position:absolute; left:-5000px; top:0">
  <input id="decoy-email" name="email" type="email" autocomplete="username">
  <input id="decoy-password" name="password" type="password" autocomplete="current-password">
</form>
<form id="ghost" action="/ghost" method="post" style="opacity:0">
  <input id="ghost-email" name="email" type="email" autocomplete="username">
  <input id="ghost-password" name="password" type="password" autocomplete="current-password">
</form>
<form id="login" action="/login" method="post">
  <label for="email">Adresse e-mail</label>
  <input id="email" name="email" type="email" autocomplete="username">
  <label for="password">Mot de passe</label>
  <input id="password" name="password" type="password" autocomplete="current-password">
  <input id="hidden-password" name="hidden_password" type="password" autocomplete="current-password" style="display:none">
  <button id="submit" type="submit">Se connecter</button>
</form>
