<h1>Connexion</h1>
<p>Compte choisi : <span id="chosen">{{chosen}}</span></p>
<p class="error" id="error">{{error}}</p>
<form id="identifier" action="{{action}}" method="post">
  <label for="identifier-email">Adresse e-mail</label>
  <input id="identifier-email" name="email" type="email" autocomplete="username">
  <button id="next" type="submit">Suivant</button>
</form>
